plugins {
    id 'com.android.application'
}

android {
    namespace 'casa.bilancio.app'
    compileSdk 35

    defaultConfig {
        applicationId "casa.bilancio.app"
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName "1.10"
    }

    // The release key lives outside the repo; without it the release build stays unsigned.
    def releaseProps = new File(System.getProperty('user.home'), '.android/bilancio-release.properties')
    signingConfigs {
        if (releaseProps.exists()) {
            release {
                def p = new Properties()
                releaseProps.withInputStream { p.load(it) }
                storeFile file(p.storeFile)
                storePassword p.storePassword
                keyAlias p.keyAlias
                keyPassword p.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseProps.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'one kotlin-stdlib only: the old jdk7/jdk8 ones collide with 1.8.22 (Duplicate class)'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'one kotlin-stdlib only: the old jdk7/jdk8 ones collide with 1.8.22 (Duplicate class)'
        }
    }
}
